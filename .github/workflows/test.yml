name: test
on:
  push:
  pull_request:
  # Fallback for start-pr-ci.sh when the pull_request run of a PR pushed with GITHUB_TOKEN cannot be approved; also usable by hand.
  workflow_dispatch:
permissions:
  contents: read
env:
  GOWORK: "off"
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'main' }}
          path: baseline
      - name: Resolve latest published API baseline
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid published API baseline: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ steps.released.outputs.tag }}
          path: released
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: candidate/go.mod
          cache-dependency-path: candidate/go.sum
      - name: Install API comparison tool
        run: GOBIN="$RUNNER_TEMP/api-tools" go install golang.org/x/exp/cmd/apidiff@v0.0.0-20261014143641-f0251eb4aa3e
      - name: Alias API regression checks
        working-directory: candidate
        env:
          APIDIFF: ${{ runner.temp }}/api-tools/apidiff
        run: bash .github/scripts/test-api-check.sh
      - name: Compare public APIs
        working-directory: candidate
        env:
          APIDIFF: ${{ runner.temp }}/api-tools/apidiff
        run: bash scripts/check-api.sh "$GITHUB_WORKSPACE/baseline"
      - name: Compare with latest published API
        working-directory: candidate
        env:
          APIDIFF: ${{ runner.temp }}/api-tools/apidiff
        run: bash scripts/check-api.sh "$GITHUB_WORKSPACE/released"
      - name: Independent consumer
        working-directory: candidate
        run: bash scripts/check-consumer.sh
      - name: Export reviewed public API
        working-directory: candidate
        env:
          APIDIFF: ${{ runner.temp }}/api-tools/apidiff
        run: |
          mkdir -p "$RUNNER_TEMP/public-api"
          "$APIDIFF" -w "$RUNNER_TEMP/public-api/root.export" github.com/yldm-tech/nodra
          "$APIDIFF" -allow-internal -w "$RUNNER_TEMP/public-api/root-types.export" github.com/yldm-tech/nodra/internal/core
          "$APIDIFF" -w "$RUNNER_TEMP/public-api/devtools.export" github.com/yldm-tech/nodra/devtools
          git rev-parse HEAD > "$RUNNER_TEMP/public-api/commit.txt"
          go version > "$RUNNER_TEMP/public-api/toolchain.txt"
          go version -m "$APIDIFF" > "$RUNNER_TEMP/public-api/comparison-tool.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-api-${{ github.sha }}
          path: ${{ runner.temp }}/public-api
          if-no-files-found: error
          retention-days: 90

  devtools-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/nodra-browser" --no-save --package-lock=false playwright@1.63.0
          "$RUNNER_TEMP/nodra-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: DevTools browser smoke
        run: |
          node --check devtools/web/app.js
          PLAYWRIGHT_PATH="$RUNNER_TEMP/nodra-browser/node_modules/playwright" node scripts/devtools-smoke.mjs

  go:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: macos-26-intel
            arch: amd64
          - os: macos-26
            arch: arm64
          - os: windows-latest
            arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify native test architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          actual=$(go env GOHOSTARCH)
          if [[ "$actual" != "$EXPECTED_ARCH" ]]; then
            echo "::error::native architecture is $actual, expected $EXPECTED_ARCH"
            exit 1
          fi
      - run: go test -race ./...
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: CGO_ENABLED=0 GOOS=linux go build ./...
      - if: runner.os == 'Linux'
        run: CGO_ENABLED=0 GOOS=windows go build ./...
      - if: runner.os == 'Linux'
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
      - if: runner.os == 'Linux'
        run: CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build ./...
      - if: runner.os == 'Linux'
        run: |
          go test -run '^$' -fuzz=FuzzVersionedJSONDecode -fuzztime=10s -parallel=2 ./internal/core
          go test -run '^$' -fuzz=FuzzHistoryStateMachine -fuzztime=10s -parallel=2 ./internal/core
          go test -run '^$' -bench=. -benchtime=1x ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  # Checks the module the way go get sees it: one go.mod at the repository root, no workspace, no replace directives, and a tidy go.mod/go.sum.
  module:
    runs-on: ubuntu-latest
    env:
      MODULE: github.com/yldm-tech/nodra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Module path
        run: |
          got=$(go mod edit -json | jq -r .Module.Path)
          if [[ "$got" != "$MODULE" ]]; then
            echo "::error file=go.mod::module path is $got, want $MODULE"
            exit 1
          fi
          echo "module path: $got"
      - name: Single module, no local wiring
        run: |
          extra=$(git ls-files '*go.mod' '*go.work' | grep -vx go.mod || true)
          if [[ -n "$extra" ]]; then
            echo "::error::the repository is one module; remove these files: $extra"
            exit 1
          fi
          replaces=$(go mod edit -json | jq -r '.Replace // [] | .[] | .Old.Path')
          if [[ -n "$replaces" ]]; then
            echo "::error file=go.mod::go.mod has replace directives, which consumers ignore: $replaces"
            exit 1
          fi
      - name: go mod tidy leaves no diff
        run: go mod tidy -diff
      - name: Release tag resolution regressions
        shell: bash
        run: bash .github/scripts/test-release-resolution.sh
