name: post-release
on:
  workflow_call:
    inputs:
      version:
        description: Released version such as v0.1.0
        type: string
        required: true
  # Manual re-run for a release whose check failed, e.g. when the proxy was slow.
  workflow_dispatch:
    inputs:
      version:
        description: Released version such as v0.1.0; defaults to the version in .release-please-manifest.json
        type: string
        required: false
permissions:
  contents: read
env:
  MODULE: github.com/yldm-tech/nodra
  GOWORK: "off"
  GOPROXY: https://proxy.golang.org
  GOSUMDB: sum.golang.org
  GOPRIVATE: ""
  GONOPROXY: ""
  GONOSUMDB: ""
jobs:
  # Proves the tag is a valid Go module tag that consumers can fetch: listed and downloaded through proxy.golang.org, checksum verified against sum.golang.org.
  verify-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve and validate release tag
        id: version
        env:
          RELEASED_VERSION: ${{ inputs.version }}
        run: bash scripts/resolve-release.sh "$RELEASED_VERSION" >> "$GITHUB_OUTPUT"
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve through proxy.golang.org
        working-directory: ${{ runner.temp }}
        env:
          GOMODCACHE: ${{ runner.temp }}/released-module-cache
          GOFLAGS: -modcacherw
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The proxy fetches a new tag on first request; retry for a few minutes in case GitHub has not served it yet.
          for attempt in $(seq 1 20); do
            if go list -m "$MODULE@$VERSION" && go mod download -json "$MODULE@$VERSION"; then
              exit 0
            fi
            echo "attempt $attempt: $MODULE@$VERSION not resolvable through the proxy yet"
            sleep 15
          done
          echo "::error::$MODULE@$VERSION does not resolve through proxy.golang.org"
          exit 1
      - name: Compile and run an independent published-module consumer
        env:
          GOMODCACHE: ${{ runner.temp }}/released-module-cache
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/check-consumer.sh "$VERSION"
